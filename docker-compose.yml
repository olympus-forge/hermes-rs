services:
  hermes:
    build: .
    container_name: hermes
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
    volumes:
      - .:/app

    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI