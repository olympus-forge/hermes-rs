services:
  hermes-core:
    build: .
    container_name: hermes-core
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080

      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME:
      SMTP_PASSWORD:

    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI