[app]
app_name = "Hermes Core"
app_host = "0.0.0.0"
app_port = 8080
app_version = "0.1.0"
env = "development"
debug = true

[http]
request_timeout_secs = 15
max_body_size_mb = 5

[log]
log_level = "info"
log_format = "json"

[email]
provider = "smtp"
from_name = "Hermes Core"
from_email = "noreply@example.com"

[email.smtp]
host = "mailpit"
port = 1025
username = ""
password = ""
pool_size = 5
starttls = true

[retry]
max_attempts = 3
backoff_secs = 10
worker_interval_secs = 30

[rate_limit]
enabled = false
requests_per_minute = 60